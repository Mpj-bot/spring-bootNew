<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <main class="page">
        <section class="launch-card" aria-labelledby="welcome-title">
            <h1 id="welcome-title">Welcome!</h1>
            <p>You are signed in as <strong th:text="${userEmail}">user@example.com</strong>.</p>
            <form action="/logout" method="post">
                <button class="btn-submit" type="submit">Sign out</button>
            </form>
        </section>
    </main>
</body>
</html>
